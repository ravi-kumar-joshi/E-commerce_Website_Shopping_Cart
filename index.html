<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce Website - Shopping Cart</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <style></style>
  </head>

  <body>
    <header>
      <a href="#" class="logo">E-Commerce</a>
      <div id="cart-icon">
        <i class="ri-shopping-bag-line"></i>
        <span class="cart-item-count"></span>
      </div>
    </header>

    <div class="cart">
      <h2 class="cart-title">Your Cart</h2>
      <div class="cart-content">
        <!-- <div class="cart-box">
          <img src="images/product1.jpg" alt="product image" class="cart-img" />
          <div class="cart-detail">
            <h2 class="cart-product-title">Casual Black Polo</h2>
            <span class="cart-price">$100</span>
            <div class="cart-quantity">
              <button id="decrement">-</button>
              <span class="number">1</span>
              <button id="increment">+</button>
            </div>
          </div>
          <i class="ri-delete-bin-line cart-remove"></i>
        </div> -->
      </div>
      <div class="total">
        <div class="total-title">Total</div>
        <div class="total-price">$0</div>
      </div>
      <button class="btn-buy">Buy Now</button>
      <i class="ri-close-line" id="cart-close"></i>
    </div>

    <section class="shop">
      <h1 class="section-title">Shop Products</h1>
      <div class="product-content">
        <div class="product-box">
          <div class="img-box">
            <img src="/images/product1.jpg" alt="Product image" />
          </div>
          <h2 class="product-title">Polo T-Shirt</h2>
          <div class="price-and-cart">
            <span class="price">₹799</span>
            <i class="ri-shopping-bag-line add-cart"></i>
          </div>
        </div>
        <div class="product-box">
          <div class="img-box">
            <img src="/images/product2.jpg" alt="Product image" />
          </div>
          <h2 class="product-title">Casual Jacket</h2>
          <div class="price-and-cart">
            <span class="price">₹1,499</span>
            <i class="ri-shopping-bag-line add-cart"></i>
          </div>
        </div>
        <div class="product-box">
          <div class="img-box">
            <img src="/images/product3.jpg" alt="Product image" />
          </div>
          <h2 class="product-title">Sweatshirt</h2>
          <div class="price-and-cart">
            <span class="price">₹999</span>
            <i class="ri-shopping-bag-line add-cart"></i>
          </div>
        </div>
        <div class="product-box">
          <div class="img-box">
            <img src="/images/product4.jpg" alt="Product image" />
          </div>
          <h2 class="product-title">Winter Jacket</h2>
          <div class="price-and-cart">
            <span class="price">₹1,899</span>
            <i class="ri-shopping-bag-line add-cart"></i>
          </div>
        </div>
        <div class="product-box">
          <div class="img-box">
            <img src="/images/product5.jpg" alt="Product image" />
          </div>
          <h2 class="product-title">Puffer Jacket</h2>
          <div class="price-and-cart">
            <span class="price">₹2,499</span>
            <i class="ri-shopping-bag-line add-cart"></i>
          </div>
        </div>
        <div class="product-box">
          <div class="img-box">
            <img src="/images/product6.jpg" alt="Product image" />
          </div>
          <h2 class="product-title">Bomber Jacket</h2>
          <div class="price-and-cart">
            <span class="price">₹1,699</span>
            <i class="ri-shopping-bag-line add-cart"></i>
          </div>
        </div>
        <div class="product-box">
          <div class="img-box">
            <img src="/images/product7.jpg" alt="Product image" />
          </div>
          <h2 class="product-title">Hoodie</h2>
          <div class="price-and-cart">
            <span class="price">₹1,199</span>
            <i class="ri-shopping-bag-line add-cart"></i>
          </div>
        </div>
        <div class="product-box">
          <div class="img-box">
            <img src="/images/product8.jpg" alt="Product image" />
          </div>
          <h2 class="product-title">Polo T-Shirt</h2>
          <div class="price-and-cart">
            <span class="price">₹699</span>
            <i class="ri-shopping-bag-line add-cart"></i>
          </div>
        </div>
      </div>
    </section>

  <script src="script.js"></script>
  </body>
</html>
